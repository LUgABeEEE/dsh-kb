name: Publish

# Publishing runs in CI, not from a laptop: a published release builds, checks
# and uploads automatically.
#
# Authentication is a repository secret, `PYPI_API_TOKEN` (a PyPI API token,
# scoped to this project).  The tidier long-term option is Trusted Publishing
# (OIDC), which needs a one-time "pending publisher" on PyPI — owner LUgABeEEE,
# repository dsh-kb, workflow publish.yml, environment pypi.  Once that exists,
# drop the `password:` line and add `permissions: id-token: write`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload the built distributions
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build and check sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --quiet --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: The wheel must install, resolve its one dependency, and run
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/dsh-kb --version
          /tmp/verify/bin/dsh-kb --help > /dev/null
          /tmp/verify/bin/python -c "import dsh_kb; print('import ok', dsh_kb.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to TestPyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
      - name: Upload to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
