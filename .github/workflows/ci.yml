name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is deliberately offline and dependency-free, so this is the
      # whole setup.  If it ever needs the network, something went wrong.
      - name: Run the test-suite
        run: python -m unittest discover -s tests -t . -v

      - name: Check the package installs and the console script runs
        run: |
          python -m pip install --quiet .
          dsh-kb --version
          dsh-kb --help > /dev/null
          python -c "import dsh_kb, sys; print('import ok, version', dsh_kb.__version__)"

  interop:
    name: MCP interop (official SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The server is hand-rolled on the standard library.  That is only a
      # defensible choice if the real client agrees with it, so CI proves it
      # against the official SDK instead of taking it on faith.
      - name: Install the official MCP SDK
        run: python -m pip install --quiet mcp

      - name: Handshake, list tools and call a tool through the SDK
        run: python -m unittest tests.test_mcp.TestOfficialSdkInterop -v

  # The semantic arm is optional, which is exactly why it needs its own job:
  # on the matrix above it *skips*, so without this nothing would ever prove
  # that it works, nor that it stays off when unconfigured.
  optional:
    name: optional arm (numpy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run this first, on a runner with no numpy at all: it asserts that
      # `import dsh_kb` pulls in no third-party module and that every optional
      # layer reports itself absent when nothing is configured.
      - name: Unconfigured means off (zero-dependency promise)
        run: python -m unittest tests.test_optional_off -v

      # Now install the one dependency the vector arm needs, and prove two
      # things: its own tests run (they skip on the matrix), and a full suite
      # with numpy present still passes — nothing may switch itself on because
      # a package happens to exist.
      - name: Install numpy and run the vector arm's tests
        run: |
          python -m pip install --quiet numpy
          python -m unittest tests.test_ragvec -v

      - name: The whole suite again, with numpy installed
        run: python -m unittest discover -s tests -t . -v

  packaging:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --quiet --upgrade build twine
          python -m build
          python -m twine check dist/*

      # What gets published is what gets tested here: no Requires-Dist (the
      # headline promise), the console script present, and an install into a
      # bare venv that is not the checkout.
      - name: The wheel is dependency-free and installs into a bare venv
        run: |
          set -eu
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet --no-index dist/*.whl
          /tmp/verify/bin/dsh-kb --version
          /tmp/verify/bin/dsh-kb --help > /dev/null
          /tmp/verify/bin/python - <<'PY'
          import sys
          import dsh_kb
          assert not [m for m in ("numpy", "onnxruntime", "tokenizers") if m in sys.modules]
          print("import ok", dsh_kb.__version__)
          PY
          python - <<'PY'
          import email.parser, pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as z:
              meta = next(n for n in z.namelist() if n.endswith("METADATA"))
              parsed = email.parser.Parser().parsestr(z.read(meta).decode())
          deps = parsed.get_all("Requires-Dist") or []
          assert not deps, f"unexpected runtime dependencies: {deps}"
          print("no Requires-Dist, as promised")
          PY

  hygiene:
    name: privacy and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials, no personal paths, no build artifacts
        run: |
          set -eu
          fail=0

          # Credential-shaped values (assignments with what looks like a real value).
          if git grep -nIE '(password|passwd|secret|api[_-]?key|access[_-]?key|private[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"']?[^[:space:]"'"'"'`,;)]{8,}' \
               -- . ':!*.lock' | grep -vE 'os\.environ|self\.password|password[[:space:]]*=[[:space:]]*(password|value)|password=yourpassword|DSH_KB_[A-Z_]*PASSWORD'; then
            echo "::error::credential-shaped assignment found"; fail=1
          fi

          # Private network addresses and machine-specific layouts.
          if git grep -nIE '(^|[^0-9])(10|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}' -- .; then
            echo "::error::private IP address found"; fail=1
          fi

          # Absolute paths that only exist on the maintainer's machine.
          if git grep -nIE '(/data/agent/|/home/[a-z0-9_-]+/(kb|dsh)|[A-Z]:\\Users\\[A-Za-z0-9_-]+)' -- . ':!*.lock' ':!.github/workflows/ci.yml'; then
            echo "::error::machine-specific path found"; fail=1
          fi

          # Committed build artifacts.
          if git ls-files | grep -E '(__pycache__|\.pyc$|\.sqlite|\.egg-info|^dist/|^build/)'; then
            echo "::error::build artifact is tracked"; fail=1
          fi

          # Project metadata must point at *this* repository.  A placeholder owner
          # survives review easily because nobody clicks a link in a diff, and it
          # ships broken URLs in the package metadata.  Found the honest way: five
          # published URLs pointed at an account that does not exist.
          if [ -n "${GITHUB_REPOSITORY:-}" ]; then
            urls=$(python3 -c "import tomllib;print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['urls'].values()))")
            if ! printf '%s\n' "$urls" | grep -q "github.com/${GITHUB_REPOSITORY}"; then
              echo "::error::pyproject.toml URLs do not reference ${GITHUB_REPOSITORY}"
              printf '  %s\n' "$urls"
              fail=1
            fi
          fi

          exit $fail
